<style>
        /* Pulse Animation for Perimeter Glow */
        @keyframes pulse-perimeter {
            0% { box-shadow: inset 0 0 50px rgba(255, 42, 77, 0.2); }
            50% { box-shadow: inset 0 0 100px rgba(255, 42, 77, 0.6); }
            100% { box-shadow: inset 0 0 50px rgba(255, 42, 77, 0.2); }
        }
        
        .alert-perimeter {
            animation: pulse-perimeter 2s infinite ease-in-out;
        }

        /* Pulse Animation for Visualizer Rings */
        @keyframes ring-pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .ring-1 { animation: ring-pulse 1.5s infinite linear; }
        .ring-2 { animation: ring-pulse 1.5s infinite linear 0.5s; }
        .ring-3 { animation: ring-pulse 1.5s infinite linear 1s; }

        /* Countdown Circle Animation */
        @keyframes countdown {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 283; } /* 2 * pi * r (r=45) = ~283 */
        }
        
        .countdown-circle {
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            animation: countdown 28s linear forwards;
        }
    </style>

<body class="bg-background text-on-surface font-body-md min-h-screen overflow-hidden select-none">
<!-- Passive Home Screen (Blurred Background) -->
<div class="fixed inset-0 z-0 bg-background pointer-events-none filter blur-md opacity-40">
<!-- Top App Bar (Suppressed via filter, just skeletal structure) -->
<header class="flex justify-between items-center w-full px-container-padding py-stack-md bg-surface/60 border-b border-white/10">
<span class="material-symbols-outlined text-primary">security</span>
<h1 class="font-display-lg text-display-lg tracking-tighter text-on-surface">AURA</h1>
<span class="material-symbols-outlined text-primary">settings_suggest</span>
</header>
<!-- Central Visualization Area (Passive) -->
<main class="flex flex-col items-center justify-center h-full pt-20">
<div class="relative w-64 h-64 rounded-full border border-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-primary opacity-50">graphic_eq</span>
</div>
</main>
</div>
<!-- Alert Overlay Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-container-padding alert-perimeter bg-primary-container/80 backdrop-blur-xl">
<!-- High-Priority Alert Card -->
<div class="w-full max-w-md bg-[#131B2E] border border-[#FF2A4D]/40 rounded-xl shadow-2xl overflow-hidden flex flex-col items-center p-stack-lg relative">
<!-- Haptic Feedback Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-[#FF2A4D] shadow-[0_0_10px_#FF2A4D]"></div>
<!-- Header -->
<div class="text-center w-full mb-stack-lg flex flex-col items-center gap-stack-sm">
<div class="flex items-center gap-base text-[#FF2A4D]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-md text-headline-md font-bold uppercase tracking-wider">Critical Threat Detected</h2>
</div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold bg-error-container/30 px-4 py-1 rounded-full border border-error-container">Gunshot</p>
</div>
<!-- Central Visual (Threat Mode) -->
<div class="relative w-48 h-48 mb-stack-lg flex items-center justify-center">
<!-- Ripples -->
<div class="absolute inset-0 rounded-full border-2 border-[#FF2A4D] ring-1"></div>
<div class="absolute inset-0 rounded-full border-2 border-[#FF2A4D] ring-2"></div>
<div class="absolute inset-0 rounded-full border-2 border-[#FF2A4D] ring-3"></div>
<!-- Center Icon -->
<div class="w-24 h-24 rounded-full bg-error-container shadow-[0_0_20px_#FF2A4D] flex items-center justify-center z-10 relative">
<span class="material-symbols-outlined text-[#FF2A4D] text-6xl" style="font-variation-settings: 'FILL' 1;">crisis_alert</span>
</div>
</div>
<!-- Countdown Section -->
<div class="flex flex-col items-center gap-stack-sm w-full mb-stack-lg">
<div class="relative w-24 h-24 flex items-center justify-center mb-stack-sm">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6"></circle>
<circle class="countdown-circle" cx="50" cy="50" fill="none" r="45" stroke="#FF2A4D" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface" id="countdown-text">28</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[250px]">
                    Sending SOS to emergency contacts in <span class="text-on-surface font-bold" id="countdown-text-inline">28</span>s...
                </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full gap-stack-md mt-auto">
<button aria-label="Send SOS Now" class="w-full bg-[#FF2A4D] hover:bg-[#FF2A4D]/80 text-white font-label-caps text-label-caps py-4 rounded-lg flex items-center justify-center gap-base transition-all shadow-[0_0_15px_rgba(255,42,77,0.5)] active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sos</span>
                    SEND SOS NOW VIA SMS
                </button>
<button aria-label="Dismiss Alarm" class="w-full bg-transparent border border-white/10 hover:bg-white/5 text-on-surface-variant font-label-caps text-label-caps py-4 rounded-lg flex items-center justify-center gap-base transition-all active:scale-95">
<span class="material-symbols-outlined">cancel</span>
                    FALSE ALARM — I'M SAFE
                </button>
</div>

<script>
        // Simple countdown logic for visual effect
        let timeLeft = 28;
        const countdownEl = document.getElementById('countdown-text');
        const countdownInlineEl = document.getElementById('countdown-text-inline');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownEl.textContent = timeLeft;
                countdownInlineEl.textContent = timeLeft;
            } else {
                clearInterval(timer);
                countdownEl.textContent = '0';
                countdownInlineEl.textContent = '0';
                // Trigger action here
            }
        }, 1000);
    </script>
