<style>
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(0, 227, 253, 0.4);
            animation: pulse 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }

        .pulse-ring:nth-child(1) { animation-delay: 0s; width: 120%; height: 120%; }
        .pulse-ring:nth-child(2) { animation-delay: 1s; width: 140%; height: 140%; }
        .pulse-ring:nth-child(3) { animation-delay: 2s; width: 160%; height: 160%; }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
                border-width: 2px;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
                border-width: 0.5px;
            }
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,227,253,0.15) 0%, rgba(10,15,29,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .shazam-btn-glow {
            box-shadow: 0 0 20px rgba(0, 227, 253, 0.3), inset 0 0 15px rgba(0, 227, 253, 0.4);
        }
    </style>
